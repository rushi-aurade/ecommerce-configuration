server:
  port: 3333

spring:
  cloud:
    gateway:

      # =========================
      # CORS CONFIGURATION
      # =========================
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      # =========================
      # API ROUTES
      # =========================
      server:
        webflux:
          routes:

            # Product Service
            - id: products-api
              uri: lb://products-api
              predicates:
                - Path=/api/products/**

            # User Service
            - id: user-api
              uri: lb://user-api
              predicates:
                - Path=/api/user/**

            # Order Service
            - id: order-api
              uri: lb://order-api
              predicates:
                - Path=/api/order/**

            # Notification Service
            - id: notifications-api
              uri: lb://notifications-api
              predicates:
                - Path=/api/notifications/**

            # Admin Service
            - id: admin-api
              uri: lb://admin-api
              predicates:
                - Path=/api/admin/**

# =========================
# LOGGING
# =========================
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: TRACE
    org.springframework.cloud.loadbalancer: DEBUG
